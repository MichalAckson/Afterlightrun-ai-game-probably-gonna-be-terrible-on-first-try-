name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2

jobs:
  validate-and-export:
    name: Validate project and export Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Generate original assets
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil espeak
          python3 tools/generate_assets.py
      - name: Install Android platform and build tools
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Download Godot stable
        run: |
          curl -fL --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION-stable/Godot_v$GODOT_VERSION-stable_linux.x86_64.zip"
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v$GODOT_VERSION-stable_linux.x86_64
          echo "$GITHUB_WORKSPACE/godot-bin" >> "$GITHUB_PATH"
      - name: Install matching export templates
        run: |
          curl -fL --retry 3 -o templates.tpz "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION-stable/Godot_v$GODOT_VERSION-stable_export_templates.tpz"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable"
          mkdir -p "$TEMPLATE_DIR" /tmp/godot-templates
          unzip -q templates.tpz -d /tmp/godot-templates
          if [ -d /tmp/godot-templates/templates ]; then
            cp -a /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"
          else
            cp -a /tmp/godot-templates/. "$TEMPLATE_DIR/"
          fi
          echo "$GODOT_VERSION.stable" > "$TEMPLATE_DIR/version.txt"
      - name: Import and validate project scripts
        run: |
          set -o pipefail
          Godot_v$GODOT_VERSION-stable_linux.x86_64 --headless --editor --path . --quit 2>&1 | tee godot-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" godot-import.log; then
            exit 1
          fi
      - name: Export ARM64 Android debug APK
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p build
          Godot_v$GODOT_VERSION-stable_linux.x86_64 --headless --path . --export-debug "Android" build/Afterlight-Android-debug.apk
          test -s build/Afterlight-Android-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Afterlight-Android-debug
          path: build/Afterlight-Android-debug.apk
          if-no-files-found: error
          retention-days: 14
